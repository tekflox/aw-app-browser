<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Map common Mac / Windows font names to available Linux equivalents.
       Chrome uses fontconfig for local font lookup, so these aliases make
       document.fonts.check('12px Arial') etc. return true. -->

  <!-- Sans-serif family -->
  <alias><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Arial Black</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Helvetica Neue</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Verdana</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Tahoma</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Trebuchet MS</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Comic Sans MS</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Impact</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Calibri</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Candara</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Segoe UI</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Gill Sans</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Optima</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Futura</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Lucida Grande</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Lucida Sans Unicode</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Microsoft Sans Serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Franklin Gothic Medium</family><prefer><family>Liberation Sans</family></prefer></alias>

  <!-- Serif family -->
  <alias><family>Times</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Georgia</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Garamond</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Baskerville</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Palatino</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Palatino Linotype</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Book Antiqua</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Cambria</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Didot</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Hoefler Text</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Constantia</family><prefer><family>Liberation Serif</family></prefer></alias>

  <!-- Monospace family -->
  <alias><family>Courier New</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias><family>Courier</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias><family>Consolas</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias><family>Lucida Console</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias><family>Andale Mono</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias><family>Monaco</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias><family>Menlo</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias><family>Inconsolata</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
