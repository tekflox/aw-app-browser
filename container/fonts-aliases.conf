<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Aliases for fonts this image ACTUALLY ships, and nothing else.

       Chrome uses fontconfig for local font lookup, so every alias here makes
       document.fonts.check('12px <name>') return true — which is exactly what
       a font-enumeration fingerprint reads. This file used to alias Mac-only
       families (Monaco, Menlo, Lucida Grande, Optima, Gill Sans, Palatino,
       Baskerville, Didot, Hoefler Text) AND Windows-only ones (Segoe UI,
       Calibri, Cambria, Candara, Consolas, Tahoma) on top of the Linux set, so
       a single machine claimed to have macOS, Windows and Linux fonts at once.
       No real machine looks like that, and it contradicted the honest
       Linux/Chromium identity platform-override.py now presents.

       What remains is true: the msttcorefonts set really is installed (see
       fonts/ and the Dockerfile's COPY), and Helvetica -> Liberation Sans /
       Times -> Liberation Serif / Courier -> Liberation Mono are the standard
       metric-compatible substitutions any ordinary Linux desktop makes. -->

  <!-- msttcorefonts, genuinely installed from fonts/ by entrypoint-lite.sh -->
  <alias><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Arial Black</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Verdana</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Trebuchet MS</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Comic Sans MS</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Impact</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Georgia</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Courier New</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias><family>Andale Mono</family><prefer><family>Liberation Mono</family></prefer></alias>

  <!-- Standard Linux metric substitutions, present on any ordinary desktop -->
  <alias><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Times</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Courier</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
