name: Build AW Browser image

# Builds OUR headless-Chromium image (container/, ported from the legacy
# monolith tools/browser/) and pushes it to ghcr.io/<owner>/aw-browser.
# The workflow-scoped GITHUB_TOKEN provides packages:write, so no external
# credential is needed. Manual trigger only (no automatic GHA runs — cost/
# quota conscious, mirrors the agents-platform image workflow).
#
#   gh workflow run build.yml                        # amd64
#   gh workflow run build.yml -f include_arm64=true  # + linux/arm64 (QEMU)
on:
  workflow_dispatch:
    inputs:
      include_arm64:
        description: 'Also build linux/arm64 (QEMU emulation; slower)'
        type: boolean
        default: false

concurrency:
  group: build-aw-browser-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: aw-browser
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io rejects mixed-case namespaces — lowercase the owner login.
      - name: Lowercase repo owner
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve platforms
        id: plat
        run: |
          if [ "${{ inputs.include_arm64 }}" = "true" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/Dockerfile
          platforms: ${{ steps.plat.outputs.platforms }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/aw-browser:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/aw-browser:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.lc }}/aw-browser:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.lc }}/aw-browser:buildcache,mode=max

      - name: Summary
        run: |
          {
            echo "## 🐳 aw-browser pushed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Image** | \`ghcr.io/${{ steps.owner.outputs.lc }}/aw-browser:latest\` |"
            echo "| **Platforms** | ${{ steps.plat.outputs.platforms }} |"
          } >> "$GITHUB_STEP_SUMMARY"
